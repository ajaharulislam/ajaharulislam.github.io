<style>
  /* =====================================================
     CONTACT PAGE
     ===================================================== */

  .contact-page {
    width: 100%;
    font-family: Arial, Helvetica, sans-serif;
    color: #292929;
  }

  .contact-page * {
    box-sizing: border-box;
  }

  /* =====================================================
     SECTION HEADING
     ===================================================== */

  .contact-page .contact-heading {
    margin: 0 0 24px;
    padding-bottom: 12px;
    border-bottom: 1px solid #dcdad6;
    color: #3154b5;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.07em;
    text-transform: uppercase;
  }

  /* =====================================================
     CONTACT DETAILS
     ===================================================== */

  .contact-list {
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .contact-item {
    display: flex;
    align-items: flex-start;
    gap: 16px;
  }

  .contact-icon {
    flex: 0 0 22px;
    width: 22px;
    height: 22px;
    color: #6b80c5;
  }

  .contact-page .contact-text {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 15px;
    line-height: 1.6;
    color: #666666;
  }

  .contact-page .contact-text a {
    color: inherit;
    text-decoration: none;
  }

  .contact-page .contact-text a:hover {
    color: #3154b5;
    text-decoration: underline;
  }

  /* =====================================================
     RESPONSIVE DESIGN
     ===================================================== */

  @media (max-width: 600px) {
    .contact-list {
      gap: 18px;
    }

    .contact-page .contact-text {
      font-size: 14px;
    }
  }
</style>


<!-- =====================================================
     CONTACT INFORMATION
     ===================================================== -->
